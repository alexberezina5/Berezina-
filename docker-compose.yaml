services:
  ollama:
    image: ollama/ollama:latest
    container_name: swaga-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - swaga-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: swaga-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do sleep 2; done; OLLAMA_HOST=http://ollama:11434 ollama pull qwen2.5:3b"
    networks:
      - swaga-network

  telegram-bot:
    build: .
    container_name: swaga-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      MODEL: qwen2.5:3b
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    networks:
      - swaga-network

networks:
  swaga-network:
    driver: bridge

volumes:
  ollama_data: